name: Deploy landing page

on:
  push:
    branches: [main]
    # The site is built from these; a change anywhere else can't affect it.
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx turbo run build --filter=@gh-runner/web

      # Pages has to be switched on once, by hand, at
      # Settings -> Pages -> Source: GitHub Actions. `enablement: true` looks
      # like it would do that for you, but creating a Pages site needs admin
      # rights and GITHUB_TOKEN doesn't have them — it fails with "Resource not
      # accessible by integration". So: check first, and say what to click.
      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            echo "Pages is enabled."
            exit 0
          fi
          echo "::error::GitHub Pages isn't enabled for this repository."
          echo "Enable it once at Settings -> Pages -> Build and deployment ->"
          echo "Source: GitHub Actions, then re-run this workflow. A workflow"
          echo "token can't do it: creating a Pages site requires admin rights."
          exit 1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Check the build produced a site
        run: |
          test -s apps/web/dist/index.html
          echo "index.html: $(wc -c < apps/web/dist/index.html) bytes"
          ls apps/web/dist/assets

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
