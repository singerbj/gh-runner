name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, format, audit, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies
        run: npm run audit

      - name: Typecheck
        run: npx turbo run typecheck

      - name: Test
        run: npx turbo run test

      - name: Build
        run: npx turbo run build

      - name: Verify the published package contents
        run: npm pack --dry-run --workspace @singerbj/gh-runner

  cli-smoke:
    name: CLI smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx turbo run build --filter=@singerbj/gh-runner

      - name: The bin runs and reports its version
        run: |
          node packages/gh-runner/dist/cli.js --help
          node packages/gh-runner/dist/cli.js --version

  # Builds the image the Docker Compose deployment runs, from whatever npm has
  # now, so a Dockerfile that stopped building shows up here and not in the
  # middle of a release.
  image-smoke:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build --pull --tag gh-runner-smoke packages/gh-runner/deploy

      - name: It runs gh-runner as an unprivileged user under tini
        run: |
          set -euo pipefail
          docker run --rm --entrypoint gh-runner gh-runner-smoke --version
          docker run --rm --entrypoint gh gh-runner-smoke --version
          test "$(docker run --rm --entrypoint id gh-runner-smoke -u)" != 0

          # What a job gets on either Linux fallback: Node, and sudo for apt-get.
          docker run --rm --entrypoint bash gh-runner-smoke -c \
            'node --version && npm --version && npx --version && sudo -n apt-get --version >/dev/null'
          # `gh-runner linux` in Docker runs config.sh from the working directory.
          docker run --rm --entrypoint bash gh-runner-smoke -c 'test -x ./config.sh && test -x ./run.sh'

          # Without its two variables it says which, rather than failing inside gh.
          if output=$(docker run --rm gh-runner-smoke 2>&1); then
            echo "::error::the image started without GH_TOKEN and GH_RUNNER_REPO."
            exit 1
          fi
          echo "$output"
          grep -q "set GH_TOKEN and GH_RUNNER_REPO" <<< "$output"
          grep -q "https://gh-runner.benjaminjsinger.com/guide/docker#configuration" <<< "$output"
