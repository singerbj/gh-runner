name: Release

# Publishes packages/gh-runner to npm when main lands a change to it. Merges
# only ever move the patch digit — the major and minor stay exactly where a
# human put them. To move those, set the version in
# packages/gh-runner/package.json yourself (a manifest ahead of npm is taken at
# its word and published as-is), or run this workflow from the Actions tab and
# pick minor or major, which resets the patch to zero.
#
# Nothing here reads commit messages. An earlier version looked for a keyword,
# and the commit that documented the keyword tripped it — 0.1.0 went straight
# to 1.0.0.
#
# Three jobs, and the split is deliberate. `npm ci` and the test suite execute
# a few hundred third-party packages' code; NPM_TOKEN would be readable by any
# one of them if it shared a job with them. So the job that runs that code has
# no secrets, and the job that holds the token installs nothing — it publishes
# a tarball the build already produced. `token` runs first so a missing secret
# fails in seconds rather than after a full build.
on:
  push:
    branches: [main]
    # Only what actually ships. A change to the landing page or the root README
    # would otherwise mint a version nobody needs.
    paths:
      - "packages/gh-runner/**"
      - "package-lock.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      level:
        description: How far to bump the version (minor and major reset the patch to zero)
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing but a test for emptiness. Without this, a missing secret surfaces as
  # `npm error code ENEEDAUTH` after a full build — technically accurate,
  # useless as a next step.
  token:
    name: Check the npm token exists
    runs-on: ubuntu-latest
    # Belt and braces: a push made with GITHUB_TOKEN doesn't trigger workflows,
    # so the bump commit can't start a second release — but if that ever
    # changes, this is what stops the loop.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Is NPM_TOKEN set?
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is set."
            exit 0
          fi
          echo "::error::NPM_TOKEN isn't set, so nothing can be published."
          echo "Create an npm automation token with publish rights, then add it"
          echo "at Settings -> Secrets and variables -> Actions -> New repository"
          echo "secret, named NPM_TOKEN. Re-run this workflow afterwards."
          exit 1

  # Runs every dependency's code, and therefore holds no secrets at all.
  build:
    name: Verify and pack
    needs: token
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      bumped: ${{ steps.version.outputs.bumped }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before the version moves: a bump commit for a build that doesn't pass
      # is a lie committed to main.
      - name: Verify
        run: npx turbo run typecheck test build

      - name: Work out the version to publish
        id: version
        env:
          LEVEL_INPUT: ${{ inputs.level }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./packages/gh-runner/package.json').name")
          manifest=$(node -p "require('./packages/gh-runner/package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"

          # A registry that's merely unreachable must not read as "never
          # published" — that would try to republish a version that exists.
          if published=$(npm view "$name" version 2> npm-view.log); then
            published=$(printf '%s' "$published" | tr -d '[:space:]')
          elif grep -qE 'E404|is not in this registry' npm-view.log; then
            published=""
          else
            echo "::error::couldn't ask npm which version of $name is published."
            cat npm-view.log
            exit 1
          fi

          if [ -z "$published" ]; then
            echo "$name isn't on npm yet — publishing $manifest as it stands."
            echo "version=$manifest" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manifest ahead of npm is a deliberate choice — someone picked that
          # number in a PR. Never overrule it.
          newest=$(printf '%s\n%s\n' "$manifest" "$published" | sort -V | tail -1)
          if [ "$manifest" != "$published" ] && [ "$newest" = "$manifest" ]; then
            echo "package.json ($manifest) is ahead of npm ($published) — publishing it as-is."
            echo "version=$manifest" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A merge is a patch, always. Anything larger is a decision, and a
          # decision needs a human: the dispatch input, or the manifest.
          level="${LEVEL_INPUT:-patch}"

          # Bump from what npm has, not from the manifest: they're equal here,
          # but only npm knows what was really released.
          npm version "$published" --workspace "$name" --no-git-tag-version --allow-same-version > /dev/null
          npm version "$level" --workspace "$name" --no-git-tag-version > /dev/null
          next=$(node -p "require('./packages/gh-runner/package.json').version")

          echo "npm has $published; publishing $next ($level)."
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # The exact bytes that will be published. Building the tarball here rather
      # than in the publish job is the point of the split: `npm publish <file>`
      # runs no lifecycle scripts, so nothing third-party executes next to the
      # token.
      - name: Pack the tarball
        id: pack
        env:
          PACKAGE: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          npm pack --workspace "$PACKAGE" --pack-destination release-artifacts > /dev/null

          count=$(find release-artifacts -maxdepth 1 -name '*.tgz' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one tarball, found $count."
            exit 1
          fi
          tarball=$(basename "$(find release-artifacts -maxdepth 1 -name '*.tgz')")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball"

          # The bumped manifests travel with it: the publish job commits them to
          # main, and it has no node_modules to regenerate them from.
          cp packages/gh-runner/package.json release-artifacts/package.json
          cp package-lock.json release-artifacts/package-lock.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 7

  # Holds NPM_TOKEN and contents: write. Installs nothing, builds nothing, and
  # runs no code from the dependency tree — only the pinned actions above and
  # npm's own publish.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The bump commit goes back to main, and the release is cut from it.
      contents: write
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bump commit is pushed back to main, which a shallow clone can't
          # do.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts

      # Pushed before the publish, so the two can't disagree: if npm then fails,
      # main already carries the version and re-running publishes it as-is.
      - name: Commit the bump to main
        if: needs.build.outputs.bumped == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cp release-artifacts/package.json packages/gh-runner/package.json
          cp release-artifacts/package-lock.json package-lock.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/gh-runner/package.json package-lock.json
          git commit -m "Release v$VERSION [skip ci] [skip release]"

          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::error::couldn't push the version bump to ${GITHUB_REF_NAME}, so nothing was published."
            echo
            echo "Two things do this:"
            echo "  1. main moved while this ran. Re-run the workflow."
            echo "  2. a branch protection rule blocks GITHUB_TOKEN. Allow the"
            echo "     GitHub Actions bot to push to ${GITHUB_REF_NAME}, or bump"
            echo "     packages/gh-runner/package.json by hand in a PR instead."
            exit 1
          fi

      - name: Publish
        id: publish
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -o pipefail
          npm publish "release-artifacts/$TARBALL" --provenance --access public 2>&1 | tee publish.log

      # npm's failures here are accurate and unhelpful in equal measure, and the
      # 403 in particular has a non-obvious cause worth naming.
      - name: Explain a publish failure
        if: steps.publish.outcome == 'failure'
        env:
          PACKAGE: ${{ needs.build.outputs.name }}
        run: |
          if grep -q "E403" publish.log; then
            echo "::error::npm refused the publish with 403 Forbidden."
            echo
            echo "The token authenticated fine, so this is about what it's allowed"
            echo "to do. The usual cause for a package that doesn't exist yet:"
            echo
            echo "  A granular access token can only be scoped to packages that"
            echo "  already exist. Scoped to 'Only select packages', it cannot"
            echo "  create a new one — which is exactly what the first publish is."
            echo
            echo "Any one of these fixes it:"
            echo "  1. Use a classic Automation token (npm -> Access Tokens ->"
            echo "     Generate New Token -> Classic -> Automation)."
            echo "  2. Use a granular token with Packages and scopes set to"
            echo "     'Read and write' on ALL packages, not selected ones."
            echo "  3. Publish this first version once from a laptop"
            echo "     (npm publish --access public), then scope a granular token"
            echo "     or Trusted Publishing to the now-existing package."
            echo
            echo "Also check the name is free and the account is allowed to publish"
            echo "it: https://www.npmjs.com/package/$PACKAGE"
          fi
          exit 1

      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$(git rev-parse HEAD)"
