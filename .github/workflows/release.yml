name: Release

# Publishes packages/gh-runner to npm when main lands a change to it. The
# version is worked out here rather than by hand: whatever npm already has,
# bumped one step. Say `[minor]` or `[major]` anywhere in a commit message for
# a bigger step, or bump packages/gh-runner/package.json yourself — a manifest
# ahead of npm is taken at its word and published as-is.
on:
  push:
    branches: [main]
    # Only what actually ships. A change to the landing page or the root README
    # would otherwise mint a version nobody needs.
    paths:
      - "packages/gh-runner/**"
      - "package-lock.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      level:
        description: How far to bump the version
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # The bump commit goes back to main, and the release is cut from it.
  contents: write
  # Required for npm provenance attestations.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Belt and braces: a push made with GITHUB_TOKEN doesn't trigger workflows,
    # so the bump commit can't start a second release — but if that ever
    # changes, this is what stops the loop.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The bump level is read from the commits since the last release, and
          # the bump commit is pushed back — both need real history.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Before the version moves: a bump commit for a build that doesn't pass
      # is a lie committed to main.
      - name: Verify
        run: npx turbo run typecheck test build

      - name: Work out the version to publish
        id: version
        env:
          LEVEL_INPUT: ${{ inputs.level }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./packages/gh-runner/package.json').name")
          manifest=$(node -p "require('./packages/gh-runner/package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"

          # A registry that's merely unreachable must not read as "never
          # published" — that would try to republish a version that exists.
          if published=$(npm view "$name" version 2> npm-view.log); then
            published=$(printf '%s' "$published" | tr -d '[:space:]')
          elif grep -qE 'E404|is not in this registry' npm-view.log; then
            published=""
          else
            echo "::error::couldn't ask npm which version of $name is published."
            cat npm-view.log
            exit 1
          fi

          if [ -z "$published" ]; then
            echo "$name isn't on npm yet — publishing $manifest as it stands."
            echo "version=$manifest" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manifest ahead of npm is a deliberate choice — someone picked that
          # number in a PR. Never overrule it.
          newest=$(printf '%s\n%s\n' "$manifest" "$published" | sort -V | tail -1)
          if [ "$manifest" != "$published" ] && [ "$newest" = "$manifest" ]; then
            echo "package.json ($manifest) is ahead of npm ($published) — publishing it as-is."
            echo "version=$manifest" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          level="${LEVEL_INPUT:-}"
          if [ -z "$level" ]; then
            # Everything since the last release, so the keyword still counts when
            # several commits land in one push or a merge buries it.
            last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            log=$(git log ${last_tag:+"$last_tag"..}HEAD --format='%B')
            level=patch
            case "$log" in
              *'[major]'*) level=major ;;
              *'[minor]'*) level=minor ;;
            esac
          fi

          # Bump from what npm has, not from the manifest: they're equal here,
          # but only npm knows what was really released.
          npm version "$published" --workspace "$name" --no-git-tag-version --allow-same-version > /dev/null
          npm version "$level" --workspace "$name" --no-git-tag-version > /dev/null
          next=$(node -p "require('./packages/gh-runner/package.json').version")

          echo "npm has $published; publishing $next ($level)."
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # Without this, a missing secret surfaces as `npm error code ENEEDAUTH`
      # after a full build — technically accurate, useless as a next step.
      - name: Check the npm token exists
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is set."
            exit 0
          fi
          echo "::error::NPM_TOKEN isn't set, so ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} can't be published."
          echo "Create an npm automation token with publish rights, then add it"
          echo "at Settings -> Secrets and variables -> Actions -> New repository"
          echo "secret, named NPM_TOKEN. Re-run this workflow afterwards."
          exit 1

      # Pushed before the publish, so the two can't disagree: if npm then fails,
      # main already carries the version and re-running publishes it as-is.
      - name: Commit the bump to main
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/gh-runner/package.json package-lock.json
          git commit -m "Release v$VERSION [skip ci] [skip release]"

          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::error::couldn't push the version bump to ${GITHUB_REF_NAME}, so nothing was published."
            echo
            echo "Two things do this:"
            echo "  1. main moved while this ran. Re-run the workflow."
            echo "  2. a branch protection rule blocks GITHUB_TOKEN. Allow the"
            echo "     GitHub Actions bot to push to ${GITHUB_REF_NAME}, or bump"
            echo "     packages/gh-runner/package.json by hand in a PR instead."
            exit 1
          fi

      - name: Publish
        id: publish
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          npm publish --workspace @singerbj/gh-runner --provenance --access public 2>&1 | tee publish.log

      # npm's failures here are accurate and unhelpful in equal measure, and the
      # 403 in particular has a non-obvious cause worth naming.
      - name: Explain a publish failure
        if: steps.publish.outcome == 'failure'
        run: |
          if grep -q "E403" publish.log; then
            echo "::error::npm refused the publish with 403 Forbidden."
            echo
            echo "The token authenticated fine, so this is about what it's allowed"
            echo "to do. The usual cause for a package that doesn't exist yet:"
            echo
            echo "  A granular access token can only be scoped to packages that"
            echo "  already exist. Scoped to 'Only select packages', it cannot"
            echo "  create a new one — which is exactly what the first publish is."
            echo
            echo "Any one of these fixes it:"
            echo "  1. Use a classic Automation token (npm -> Access Tokens ->"
            echo "     Generate New Token -> Classic -> Automation)."
            echo "  2. Use a granular token with Packages and scopes set to"
            echo "     'Read and write' on ALL packages, not selected ones."
            echo "  3. Publish this first version once from a laptop"
            echo "     (npm publish --access public), then scope a granular token"
            echo "     or Trusted Publishing to the now-existing package."
            echo
            echo "Also check the name is free and the account is allowed to publish"
            echo "it: https://www.npmjs.com/package/${{ steps.version.outputs.name }}"
          fi
          exit 1

      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$(git rev-parse HEAD)"
